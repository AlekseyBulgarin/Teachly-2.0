groups:
  - name: teachly-recording
    interval: 30s
    rules:
      - record: teachly:api_request_rate5m
        expr: sum(rate(teachly_http_requests_total[5m]))
      - record: teachly:api_error_ratio5m
        expr: sum(rate(teachly_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(teachly_http_requests_total[5m])), 0.001)
      - record: teachly:api_latency_p95_seconds5m
        expr: histogram_quantile(0.95, sum(rate(teachly_http_request_duration_seconds_bucket[5m])) by (le))
      - record: teachly:ai_failure_ratio5m
        expr: sum(rate(teachly_ai_requests_total{status=~"failed|timeout|invalid_output"}[5m])) / clamp_min(sum(rate(teachly_ai_requests_total[5m])), 0.001)

  - name: teachly-alerts
    interval: 30s
    rules:
      - alert: TeachlyApiUnavailable
        expr: up{job="teachly-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: teachly-api
          owner: teachly-platform
        annotations:
          summary: Teachly API metrics target is unavailable
          runbook: docs/operations/observability.md
      - alert: TeachlyApiErrorRatioHigh
        expr: teachly:api_error_ratio5m > 0.05
        for: 10m
        labels:
          severity: critical
          service: teachly-api
          owner: teachly-platform
        annotations:
          summary: Teachly API 5xx ratio is above 5%
          runbook: docs/operations/observability.md
      - alert: TeachlyApiLatencyHigh
        expr: teachly:api_latency_p95_seconds5m > 1
        for: 10m
        labels:
          severity: warning
          service: teachly-api
          owner: teachly-platform
        annotations:
          summary: Teachly API p95 latency is above one second
          runbook: docs/operations/observability.md
      - alert: TeachlyAiFailureRatioHigh
        expr: teachly:ai_failure_ratio5m > 0.15
        for: 10m
        labels:
          severity: warning
          service: teachly-api
          owner: teachly-platform
        annotations:
          summary: Teachly AI failure ratio is above 15%
          runbook: docs/operations/observability.md
      - alert: TeachlyRateLimitRejectionsHigh
        expr: sum(rate(teachly_http_requests_total{status_code="429"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: teachly-api
          owner: teachly-platform
        annotations:
          summary: Teachly is rejecting more than one request per second
          runbook: docs/operations/observability.md
      - alert: TeachlyMonitoringPipelineUnavailable
        expr: up{job=~"prometheus|alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          service: teachly-observability
          owner: teachly-platform
        annotations:
          summary: A Teachly monitoring component is unavailable
          runbook: docs/operations/observability.md
      - alert: TeachlyPrometheusStorageNearLocalLimit
        expr: prometheus_tsdb_storage_blocks_bytes > 4500000000
        for: 15m
        labels:
          severity: warning
          service: teachly-observability
          owner: teachly-platform
        annotations:
          summary: Prometheus storage is above 4.5 GB of the 5 GB local ceiling
          runbook: docs/operations/observability.md
      - alert: TeachlyAlertDeliveryFailing
        expr: sum(rate(alertmanager_notifications_failed_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: teachly-observability
          owner: teachly-platform
        annotations:
          summary: Alertmanager is failing to deliver notifications
          runbook: docs/operations/observability.md
