name: Production uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public showcase
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 https://teachly-tau.vercel.app/ecosystem > /dev/null
      - name: Check API readiness
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 https://teachlyapi-production.up.railway.app/health/ready > /dev/null
