name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm --filter @teachly/api typecheck
      - run: pnpm --filter @teachly/api lint
      - run: pnpm --filter @teachly/api build
      - run: pnpm --filter @teachly/api test:unit
      - run: pnpm --filter @teachly/api openapi:check

  database:
    runs-on: ubuntu-latest
    env:
      ALLOW_TEST_DB_RESET: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm --filter @teachly/api test:database
      - name: Verify generated migrations are committed
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- database/migrations)" ]; then
            echo "Drizzle schema and committed migration metadata are out of sync."
            git status --short -- database/migrations
            exit 1
          fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm contracts:check
      - run: pnpm --filter @teachly/contracts typecheck
      - run: pnpm --filter @teachly/contracts test
      - run: pnpm --filter @teachly/example-consumer check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm --filter @teachly/web typecheck
      - run: pnpm --filter @teachly/web test:unit
      - run: pnpm --filter @teachly/web build
      - run: pnpm --filter @teachly/web exec playwright install --with-deps chromium
      - run: pnpm --filter @teachly/web test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm --filter @teachly/web build
      - run: pnpm --filter @teachly/web exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/lighthouse-reports
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm security:audit
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
